name: Generate pairs

on:
  schedule:
    # GitHub starts scheduled runs hours late (5 to 9 hours in autumn 2026),
    # so the run is scheduled for the night to land in the morning
    - cron: '5 3 * * 1'
      timezone: 'Europe/Nicosia'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Print the pairs without writing to Notion or posting to Slack'
        type: boolean
        default: false

# The rerun guard reads Notion before writing, so runs must not overlap
concurrency:
  group: generate-pairs
  cancel-in-progress: false

jobs:
  run-yarn-start:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Run yarn start
        run: yarn start ${{ inputs.dry_run && '--dry-run' || '' }}
        env:
          # The week starts on Monday in the team's time zone, not in the runner's UTC
          TZ: Europe/Nicosia
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          SLACK_TOKEN: ${{ secrets.SLACK_TOKEN }}
