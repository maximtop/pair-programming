name: Generate pairs

on:
  schedule:
    - cron: '5 7 * * 1'
      timezone: 'Europe/Nicosia'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Print the pairs without writing to Notion or posting to Slack'
        type: boolean
        default: false

jobs:
  run-yarn-start:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install dependencies
        run: yarn install

      - name: Run yarn start
        run: yarn start ${{ inputs.dry_run && '--dry-run' || '' }}
        env:
          NOTION_API_KEY: ${{ secrets.NOTION_API_KEY }}
          SLACK_TOKEN: ${{ secrets.SLACK_TOKEN }}
